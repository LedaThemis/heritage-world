name: CI

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Create tarball
              run: |
                  cd dist
                  tar -czf ../heritage-world-${{ github.sha }}.tar.gz .
                  cd ..

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: heritage-world-latest
                  path: heritage-world-${{ github.sha }}.tar.gz
                  retention-days: 7
